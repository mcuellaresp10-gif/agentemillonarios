# API Express (sin frontend). El sitio estático va en Netlify.
services:
  - type: web
    name: millonarios-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /api/market/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_ONLY
        value: "true"
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: REQUIRE_ACCESS_CODE
        value: "false"
      - key: APP_ACCESS_SECRET
        sync: false
