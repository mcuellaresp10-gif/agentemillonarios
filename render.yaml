# Despliegue completo (frontend + API) en Render
services:
  - type: web
    name: agentemillonarios
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: REQUIRE_ACCESS_CODE
        value: "false"
      - key: APP_ACCESS_SECRET
        sync: false
